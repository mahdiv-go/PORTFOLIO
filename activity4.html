<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 4 - User Information Form</title>
</head>
<body>
    <h1>User Information Form</h1>
    <form id="userForm">
        <div>
            <label for="firstName">First name:</label>
            <input type="text" id="firstName" name="firstName" required>
        </div>

        <div>
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required>
        </div>

        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="120" required>
        </div>

        <div>
            <label>Gender:</label><br>
            <input type="radio" name="gender" value="male" required> Male<br>
            <input type="radio" name="gender" value="female" required> Female<br>
            <input type="radio" name="gender" value="other" required> Other
        </div>

        <div>
            <label>Hobbies:</label><br>
            <input type="checkbox" name="hobbies" value="reading"> Reading<br>
            <input type="checkbox" name="hobbies" value="traveling"> Traveling<br>
            <input type="checkbox" name="hobbies" value="gaming"> Gaming<br>
            <input type="checkbox" name="hobbies" value="cooking"> Cooking<br>
            <input type="checkbox" name="hobbies" value="sports"> Sports
        </div>

        <div>
            <label for="yearLevel">Year Level:</label>
            <select id="yearLevel" name="yearLevel" required>
                <option value="">Select year level</option>
                <option value="1st">1st year</option>
                <option value="2nd">2nd year</option>
                <option value="3rd">3rd year</option>
                <option value="4th">4th year</option>
            </select>
        </div>

        <div>
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>
        </div>
    </form>

    <script>
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Form submitted successfully!');
        });
    </script>
</body>
</html>
