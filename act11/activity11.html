<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loops Demo</title>
  <style>
    body {
      font-family: Arial;
    }
    .container {
      display: flex;
      justify-content: space-around;
      margin-top: 50px;
    }
    .box {
      text-align: center;
    }
    input {
      margin: 5px;
      padding: 5px;
    }
    button {
      margin: 5px;
      padding: 5px 10px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- FOR LOOP -->
  <div class="box">
    <h2>For Loop</h2>
    Number: <input type="number" id="forNum"><br>
    Text: <input type="text" id="forText"><br>
    <button onclick="showFor()">Show</button>
    <button onclick="clearFor()">Clear</button><br>
    <textarea id="forOutput" rows="6" cols="20"></textarea>
  </div>

  <!-- WHILE LOOP -->
  <div class="box">
    <h2>While Loop</h2>
    Number: <input type="number" id="whileNum"><br>
    Text: <input type="text" id="whileText"><br>
    <button onclick="showWhile()">Show</button>
    <button onclick="clearWhile()">Clear</button><br>
    <textarea id="whileOutput" rows="6" cols="20"></textarea>
  </div>

  <!-- DO-WHILE LOOP -->
  <div class="box">
    <h2>Do-While Loop</h2>
    Number: <input type="number" id="doNum"><br>
    Text: <input type="text" id="doText"><br>
    <button onclick="showDo()">Show</button>
    <button onclick="clearDo()">Clear</button><br>
    <textarea id="doOutput" rows="6" cols="20"></textarea>
  </div>

</div>

<script>
  function showFor() {
    let n = document.getElementById("forNum").value;
    let text = document.getElementById("forText").value;
    let output = "";

    for (let i = 1; i <= n; i++) {
      output += text + "\n";
    }

    document.getElementById("forOutput").value = output;
  }

  function clearFor() {
    document.getElementById("forNum").value = "";
    document.getElementById("forText").value = "";
    document.getElementById("forOutput").value = "";
  }

  function showWhile() {
    let n = document.getElementById("whileNum").value;
    let text = document.getElementById("whileText").value;
    let output = "";
    let i = 1;

    while (i <= n) {
      output += text + "\n";
      i++;
    }

    document.getElementById("whileOutput").value = output;
  }

  function clearWhile() {
    document.getElementById("whileNum").value = "";
    document.getElementById("whileText").value = "";
    document.getElementById("whileOutput").value = "";
  }

  function showDo() {
    let n = document.getElementById("doNum").value;
    let text = document.getElementById("doText").value;
    let output = "";
    let i = 1;

    if (n > 0) {
      do {
        output += text + "\n";
        i++;
      } while (i <= n);
    }

    document.getElementById("doOutput").value = output;
  }

  function clearDo() {
    document.getElementById("doNum").value = "";
    document.getElementById("doText").value = "";
    document.getElementById("doOutput").value = "";
  }
</script>

</body>
</html>
