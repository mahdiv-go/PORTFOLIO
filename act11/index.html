<!DOCTYPE html>
<html lang="en">
<head>
    <title>Activity 11</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="loop-box">
            <h2>For Loop</h2>
            <label>Enter number: <input type="text" id="forNumber"></label><br>
            <label>Enter text: <input type="text" id="forText"></label><br>
            <button onclick="showForLoop()">Show</button>
            <button type="reset" onclick="clearFieldsFor()">Clear</button>
            <div id="forOutput"></div>
        </div>

        <div class="loop-box">
            <h2>While Loop</h2>
            <label>Enter number: <input type="text" id="whileNumber"></label><br>
            <label>Enter text: <input type="text" id="whileText"></label><br>
            <button onclick="showWhileLoop()">Show</button>
            <button type="reset" onclick="clearFieldsWhile()">Clear</button>
            <div id="whileOutput"></div>
        </div>

        <div class="loop-box">
            <h2>Do-While Loop</h2>
            <label>Enter number: <input type="text" id="doWhileNumber"></label><br>
            <label>Enter text: <input type="text" id="doWhileText"></label><br>
            <button onclick="showDoWhileLoop()">Show</button>
            <button type="reset" onclick="clearFieldsDoWhile()">Clear</button>
            <div id="doWhileOutput"></div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
